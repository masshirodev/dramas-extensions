[versions]
# Kept in step with buildSrc/build.gradle.kts, which applies the plugins.
kotlin = "2.2.20"
agp = "8.13.0"

[libraries]
# Aniyomi's extension API, lib 14. Compile-only: the host app supplies the classes.
aniyomi-lib = { module = "com.github.aniyomiorg:extensions-lib", version = "14" }
# What the host app provides at runtime. Compile-only, and never newer than what
# Aniyomi and tsundoku-engine ship (engine: serialization 1.9.0, jsoup 1.21.2,
# okhttp 5.3.2), so nothing here calls an API the host lacks.
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
jsoup = { module = "org.jsoup:jsoup", version = "1.17.2" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
rxjava = { module = "io.reactivex:rxjava", version = "1.3.8" }
junit = { module = "junit:junit", version = "4.13.2" }

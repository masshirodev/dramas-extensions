org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=false
# The host app (Aniyomi, or tsundoku's engine) provides the Kotlin standard library;
# an extension must not ship its own copy.
kotlin.stdlib.default.dependency=false
# Compile Kotlin inside Gradle's own process: no Kotlin daemon is left running
# after a build (AGENTS.md, "Processes").
kotlin.compiler.execution.strategy=in-process

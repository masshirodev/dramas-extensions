    "special_desc": "<h4><span data-sheets-root=\"1\">The Story of The Triplets' Final Regret:<\/span><\/h4>\n<p><span data-sheets-root=\"1\"><br />In The Triplets' Final Regret movie, for ten years, Elisa Carter, a half-human and half-vampire girl loved and cared for the Lockhart triplets. She even wanted to become a full human and marry one of them. But when they brutally abandoned her for the maid's daughter&mdash;Amber, Elisa's heart was shattered, and she was stripped of her dignity.<\/span><\/p>\n<p><span data-sheets-root=\"1\"><br />Hence, as Elisa turned eighteen, she transferred to night school and became a full vampire. She also found love with the elite and powerful vampire lord Caine Trueblood, which ultimately led to the ruin of the Lockhart triplets. Now, as the triplets return, begging for forgiveness, will Elisa Carter give them a second chance, or will she build a new life with the vampire lord?<\/span><\/p>\n<h4><span data-sheets-root=\"1\"> <br />Characters:<\/span><\/h4>\n<p><span data-sheets-root=\"1\"> <br /><strong>Elisa Carter<\/strong><br />Elisa Carter is the female protagonist of The Triplets' Final Regret movie. She was an orphan, a half-human and half-vampire girl who was adopted by the elite Lockhart family. But when her protectors&mdash;the Lockhart triplets&mdash;turned into her tormentors and abandoned her, she became a full vampire and moved to night school.<\/span><\/p>\n<p><span data-sheets-root=\"1\"> <br /><strong>The Lockhart Triplets<\/strong><br />Jacob, Oliver, and Nash are the elite Lockhart triplets and the male leads of The Triplets' Final Regret movie. They promised to protect Elisa forever, but when they fell for Amber's lies, they deeply hurt Elisa and abandoned her only to regret it all in the end.<\/span><\/p>\n<p><span data-sheets-root=\"1\"> <br /><strong>Caine Trueblood<\/strong><br />Caine Trueblood is Elisa Carter's love interest. He was the powerful vampire lord who commanded the elite Cross Academy. When Elisa Carter was abandoned by the Lockhart triplets, he took her under his wing and became her ultimate protector.<\/span><\/p>\n<p><span data-sheets-root=\"1\"><br /><strong>Amber Jackson<\/strong><br />Amber Jackson is the antagonist of The Triplets' Final Regret movie. She was a maid's daughter who stole Elisa Carter's status by lies and malicious tricks. <br /><br /><br /><\/span><\/p>\n<p><textarea id=\"BFI_DATA\" style=\"width: 1px; height: 1px; display: none;\"><\/textarea><\/p>\n<div id=\"WidgetFloaterPanels\" class=\"LTRStyle\" style=\"display: none; text-align: left; direction: ltr; visibility: hidden;\" translate=\"no\">\n<div id=\"WidgetFloater\" style=\"display: none;\">\n<div id=\"WidgetLogoPanel\"><span id=\"WidgetTranslateWithSpan\">TRANSLATE with <img id=\"FloaterLogo\" alt=\"\" /><\/span> <span id=\"WidgetCloseButton\" title=\"Exit Translation\">x<\/span><\/div>\n<div id=\"LanguageMenuPanel\">\n<div class=\"DDStyle_outer\"><input id=\"LanguageMenu_svid\" style=\"display: none;\" autocomplete=\"on\" name=\"LanguageMenu_svid\" type=\"text\" value=\"en\" /> <input id=\"LanguageMenu_textid\" style=\"display: none;\" autocomplete=\"on\" name=\"LanguageMenu_textid\" type=\"text\" /> <span id=\"__LanguageMenu_header\" class=\"DDStyle\" tabindex=\"0\">English<\/span>\n<div style=\"position: relative; text-align: left; left: 0;\">\n<div style=\"position: absolute; ;left: 0px;\">\n<div id=\"__LanguageMenu_popup\" class=\"DDStyle\" style=\"display: none;\">\n<table id=\"LanguageMenu\" border=\"0\">\n<tbody>\n<tr>\n<td><a tabindex=\"-1\" href=\"#ar\">Arabic<\/a><\/td>\n<td><a tabindex=\"-1\" href=\"#he\">Hebrew<\/a><\/td>\n<td><a tabindex=\"-1\" href=\"#pl\">Polish<\/a><\/td>\n<\/tr>\n<tr>\n<td><a tabindex=\"-1\" href=\"#bg\">Bulgarian<\/a><\/td>\n<td><a tabindex=\"-1\" href=\"#hi\">Hindi<\/a><\/td>\n<td><a tabindex=\"-1\" href=\"#pt\">Portuguese<\/a><\/td>\n<\/tr>\n<tr>\n<td><a tabindex=\"-1\" href=\"#ca\">Catalan<\/a><\/td>\n<td><a tabindex=\"-1\" href=\"#mww\">H
